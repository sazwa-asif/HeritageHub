<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeritageHub - Hiran Minar</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/main-logo.png') }}" type="image/x-icon">    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f1e9; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            background: white;
            width: 85vw;
            height: 75vh;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            align-items: center;
            padding: 40px;
        }

        .text-section {
            width: 60%;
            padding-right: 30px;
        }

        h1 {
            font-size: 40px;
            color: #8b5e3c;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 22px;
            color:#8B4513;
            margin-bottom: 8px;
        }

        p {
            font-size: 17px;
            color: #555;
            line-height: 1.6;
        }

        .image-section {
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-section img {
            width: 100%;
            height: auto;
            max-height: 90%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.2);
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #d9a953;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            background-color: #8b5e3c;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                padding: 20px;
                border-radius: 30px;
            }

            .text-section {
                width: 100%;
                text-align: center;
            }

            .image-section {
                width: 100%;
                margin-top: 20px;
            }

            .image-section img {
                width: 80%;
                max-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-section">
            <h1>Hiran Minar</h1>

            <h2>OVERVIEW</h2>
            <p>{{ overview }}</p>

            <h2>HISTORY</h2>
            <p>{{ history }}</p>

            <h2>ARCHTECTURE</h2>
            <p>{{ architecture }}</p>

            <a href="/first" class="back-btn">⬅ Back to Site</a>
        </div>

        <div class="image-section">
            <img src="/hiran_image" alt="Mohenjo-Daro Image">
        </div>
    </div>
</body>
</html>
